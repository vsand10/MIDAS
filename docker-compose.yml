# Docker Compose setup for running the MIDAS backend and PostgreSQL database together

services:

  # PostgreSQL database service
  db:
    # Use PostgreSQL version 16
    image: postgres:16
    # Name of database container
    container_name: midas-db
    # Database settings loaded from the .env file
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # PostgreSQL uses port 5432
    ports:
      - "5432:5432"
    # Keep database data saved even if the container stops
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # FastAPI backend service
  backend:
    # Build the backend using the Dockerfile inside the backend folder
    build: ./backend
    # Name of backend container
    container_name: midas-backend
    # FastAPI backend uses port 8000
    ports:
      - "8000:8000"
    # Connect the local backend folder to the container
    volumes:
      - ./backend:/app
    # Give the backend the database connection address
    environment:
      DATABASE_URL: ${DATABASE_URL}
    # Start the database before starting the backend
    depends_on:
      - db
# Create a Docker volume to store PostgreSQL data
volumes:
  postgres_data: